    <!-- Contact Section -->
    <section class="contact">

        <div class="section-container">

            <h2 class="section-title">Let's Connect</h2>

            <div class="contact-content">

                <!-- Contact Form -->
                <div class="contact-form">

                    <form action="https://formspree.io/f/xkodevez" method="POST">

                        <div class="form-group">
                            <input type="text" name="name" placeholder="Your Name" required>
                        </div>

                        <div class="form-group">
                            <input type="email" name="email" placeholder="Your Email" required>
                        </div>

                        <div class="form-group">
                            <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                        </div>

                        <button type="submit" class="submit-btn">
                            Send Message
                        </button>

                    </form>

                </div>


                <!-- Contact Information -->
                <div class="contact-info">

                    <div class="info-item">
                        <span class="icon">⌂</span>

                        <div>
                            <strong>Chittagong, Bangladesh</strong>
                        </div>
                    </div>


                    <div class="info-item">
                        <span class="icon">✉</span>

                        <div>
                            <strong>mahmoodazwad@gmail.com</strong>
                        </div>
                    </div>


                    <!-- Social Links -->
                    <div class="social-links">

                        <a href="https://github.com/1AZWAD" target="_blank" rel="noopener noreferrer"
                            class="social-icon">
                            <img src="./assets/icons/github.png" alt="GitHub">
                        </a>

                        <a href="https://www.linkedin.com/in/sheikh-azwad-mahmood-7a0b43329" target="_blank"
                            rel="noopener noreferrer" class="social-icon">
                            <img src="./assets/icons/linkedin.png" alt="LinkedIn">
                        </a>

                        <a href="https://x.com/AzwadSheikh" target="_blank" rel="noopener noreferrer"
                            class="social-icon">
                            <img src="./assets/icons/twitter.png" alt="X">
                        </a>

                        <a href="mailto:mahmoodazwad@gmail.com" class="social-icon">
                            <img src="./assets/icons/mail.png" alt="Email">
                        </a>

                    </div>

                </div>

            </div>

        </div>
